System:
  system: test_validate_system_disconnected_executors_detected
  default_distribution: Humble
  hosts:
  - host:
    executors:
    - executor: exe_1
      nodes:
      - node: node_1     
        callbacks:
        - callback: cb_1
          wcet: 3
          request:
            client: client_1
            response: response_cb
        - callback: response_cb
          wcet: 1
        timers:
        - timer: timer_1
          period: 5
          offset: -5
          callback: cb_1
        clients:
        - client: client_1
          service: service_1
        
    - executor: exe_2
      nodes:
      - node: node_2
        callbacks:
        - callback: cb_3
          wcet: 5
        services:
        - service: service_1
          callback: cb_3

    - executor: exe_3
      nodes:
      - node: node_3
        callbacks:
        - callback: cb_4
          wcet: 5
          publishers:
          - pub_1
        publishers:
        - publisher: pub_1
          topic: topic_1
        timers:
        - timer: timer_2
          callback: cb_4
          period: 10

    - executor: exe_4
      nodes:
      - node: node_4
        callbacks:
        - callback: cb_5
          wcet: 5
        subscriptions: 
        - subscription: sub_1
          topic: topic_1
          callback: cb_5
