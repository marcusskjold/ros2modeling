          offset: 0
          callback: cb_1
        - timer: timer_2
          period: 10
          offset: 0
          callback: cb_2
        
    - executor: exe_2
      nodes:
      - node: node_2
        callbacks:
        - callback: cb_4
          wcet: 5
        subscriptions:
        - subscription: sub_1
          callback: cb_4
          topic: topic_1
        - subscription: sub_2
          callback: cb_4
          topic: topic_2
        - subscription: sub_3
          callback: cb_4
          topic: topic_2