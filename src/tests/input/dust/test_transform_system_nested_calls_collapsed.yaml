      - node: node_1
        publishers:
        - publisher: pub_1
          topic: topic_1
        - publisher: pub_2
          topic: topic_2  
        - publisher: pub_3
          topic: topic_1     
        callbacks:
        - callback: cb_1
          wcet: 3
          publishers:
          - pub_1
