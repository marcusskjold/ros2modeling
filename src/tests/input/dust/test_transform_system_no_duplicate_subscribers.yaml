System:
  system: test_transform_system_no_duplicate_subscribers
  default_distribution: Humble
  hosts:
  - host:
    executors:
    - executor: exe_1
      nodes:
      - node: node_1
        publishers:
        - publisher: pub_1
          topic: topic_1       
        callbacks:
        - callback: cb_1
          wcet: 3
          publishers:
          - publisher: pub_1
        timers:
        - timer: timer_1
          period: 5
          offset: 0
          callback: cb_1
        - timer: timer_2
          period: 10
          offset: 0
          callback: cb_1
        
    - executor: exe_2
      nodes:
      - node: node_2
        callbacks:
        - callback: cb_2
          wcet: 5
        subscriptions:
        - subscription: sub_1
          callback: cb_2
          topic: topic_1
