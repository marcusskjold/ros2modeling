System:
  system: dust_scenario_2_EXV1_holistic
  default_distribution: Dashing
  hosts:
  - host: 
    executors:
      - executor: exe_1
        implementation: SingleThreadedExecutor
        nodes:
        - node: node_1
          timers:
          - timer: sequence_0
            callback: seq_0_cb
            period: 1
            offset: -1
            end: 0
          - timer: sequence_1
            callback: seq_1_cb
            period: 32
            end: 32
          - timer: sequence_2
            callback: seq_2_cb
            period: 45
            end: 45
          - timer: sequence_3
            callback: seq_3_cb
            period: 63
            end: 63
          publishers:
          - publisher: pub_H
            topic: topic_H
          - publisher: pub_M
            topic: topic_M
          - publisher: pub_L
            topic: topic_L
          clients:
          - client: client_SH
            service: SH
          - client: client_SM
            service: SM
          - client: client_SL
            service: SL
          callbacks:
          - callback: response_cb
            wcet: 0
          - callback: seq_0_cb
            wcet: 0
            publishers:
            - pub_H
            - pub_M
            - pub_L
            requests: 
            - client: client_SH 
              response: response_cb
            - client: client_SM
              response: response_cb
            - client: client_SL
              response: response_cb
          - callback: seq_1_cb
            wcet: 0
            publishers:
            - pub_H
            - pub_M
            - pub_L
          - callback: seq_2_cb
            wcet: 0
            requests: 
            - client: client_SH
              response: response_cb
            - client: client_SM
              response: response_cb
          - callback: seq_3_cb
            wcet: 0
            publishers:
            - pub_H
      
      - executor: exe_2
        implementation: SingleThreadedExecutor
        nodes:
        - node: node_2
          callbacks:
          - callback: dummy_cb
            wcet: 5
          timers:
          - timer: T0
            period: 13
            callback: dummy_cb
          services:
          - service: SH
            callback: dummy_cb
          - service: SM
            callback: dummy_cb
          - service: SL
            callback: dummy_cb
          subscriptions:
          - subscription: H
            callback: dummy_cb
            topic: topic_H
          - subscription: M
            callback: dummy_cb
            topic: topic_M
          - subscription: L
            callback: dummy_cb
            topic: topic_L