System:
  system: test_validate_calls_registers_root
  hosts:
  - host:
    executors:
    - nodes:
      - node: node_1
        publishers:
        - publisher: pub_1
          topic: topic_1
        callbacks:
        - callback: cb
          wcet : 5
          calls : nested_cb
        - callback: nested_cb
          wcet : 5
          publishers: [pub_1]
          calls : nested_nested_cb
        - callback : nested_nested_cb
          wcet: 5
          requests:
          - client: client_1
            response: response_cb
        - callback: response_cb
          wcet: 5
        timers:
        - period: 10
          callback: cb
        clients: 
        - client: client_1
          service: service_1

      - node: node_2
        callbacks:
        - callback: service_cb 
          wcet: 5
        - callback: sub_cb
          wcet: 5
        subscriptions: 
        - subscription: sub_1
          topic: topic_1
          callback: sub_cb
        services:
        - service: service_1
          callback: service_cb
