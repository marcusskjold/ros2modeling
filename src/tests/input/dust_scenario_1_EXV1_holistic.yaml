          period: 1
          offset: -1
          end: 0
        - timer: sequence_2
          callback: seq_2_cb
          period: 15
          offset: 0 
          end: 15
        publishers:
        - publisher: pub_H
          topic: topic_H
        - publisher: pub_M
          topic: topic_M
        - publisher: pub_L
          topic: topic_L
        clients:
        - client: client_SH
          service: service_SH
        - client: client_SM
          service: service_SM
        - client: client_SL
          service: service_SL
        callbacks:
        - callback: response_SH
          wcet: 0
        - callback: response_SM
          wcet: 0
        - callback: response_SL
          wcet: 0
        - callback: seq_1_cb
          wcet: 0
          publishers:
          - pub_L
          - pub_M
          - pub_H
          # - pub_SH
          # - pub_SL
          - pub_L
          - pub_M
          - pub_H 
          # - pub_SH 
          # - pub_SL
          request: 
            client: client_SH 
            response: response_SH
          calls: nest_1
        - callback: nest_1
          wcet: 0
          request: 
            client: client_SL
            response: response_SL 
          calls: nest_2
        - callback: nest_2
          wcet: 0 
          request: 
            client: client_SH
            response: response_SH
          calls: nest_3
        - callback: nest_3
          wcet: 0
          request: 
            client: client_SL  
            response: response_SL
        - callback: seq_2_cb
          wcet: 0
          publishers:
          - pub_H
          request:
            client: client_SM 
            response: response_SM
          calls: nest_4
        - callback: nest_4
          wcet: 0
          request:
            client: client_SM
            response: response_SM

    - executor: executor_1
